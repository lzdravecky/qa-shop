<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>QA Shop - Products</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <header>
    <a class="brand" href="/">QA Shop</a>
    <nav aria-label="Main navigation">
      <a href="/">Products</a>
      <button id="cart-button" type="button">Cart (<span id="cart-count">0</span>)</button>
    </nav>
  </header>

  <main>
    <section class="hero">
      <p class="eyebrow">QA SHOP · RELEASE 1.0</p>
      <h1>Products</h1>
      <p>A tiny local shop built as a system under test for Playwright practice.</p>
    </section>

    <section aria-label="Product tools" class="tools">
      <label for="search">Search products</label>
      <input id="search" name="search" type="search" placeholder="e.g. keyboard">
    </section>

    <p id="status" role="status" aria-live="polite"></p>
    <section id="products" aria-label="Product list" class="grid"></section>

    <section id="cart-panel" class="panel hidden" aria-labelledby="cart-heading">
      <div class="panel-head">
        <h2 id="cart-heading">Your cart</h2>
        <button id="close-cart" type="button" aria-label="Close cart">×</button>
      </div>
      <div id="cart-items"></div>
      <p class="total">Total: <strong id="cart-total">€0.00</strong></p>
      <button id="checkout" type="button">Checkout</button>
    </section>

    <section id="checkout-panel" class="checkout hidden" aria-labelledby="checkout-heading">
      <h2 id="checkout-heading">Checkout</h2>
      <form id="checkout-form">
        <label for="full-name">Full name</label>
        <input id="full-name" name="fullName" autocomplete="name">

        <label for="email">Email</label>
        <input id="email" name="email" type="email" autocomplete="email">

        <button type="submit">Place order</button>
      </form>
      <p id="checkout-error" role="alert" class="error"></p>
    </section>

    <section id="success" class="success hidden" aria-labelledby="success-heading">
      <h2 id="success-heading">Order confirmed</h2>
      <p>Thanks for your order.</p>
    </section>
  </main>

  <script src="/app.js"></script>
</body>
</html>
